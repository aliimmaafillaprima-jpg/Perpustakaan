<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="title desc">
  <title id="title">LENDORA — Poster Perpustakaan Digital Sekolah</title>
  <desc id="desc">Poster A4 promosi perpustakaan digital LENDORA dengan mockup laptop katalog dan ponsel login, fitur, alamat website, dan slogan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7ff"/>
      <stop offset=".48" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset=".58" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7ff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bookD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#312e81" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
    <style>
      .sans { font-family: "Aptos", "Segoe UI", Arial, sans-serif; }
      .ink { fill: #1e1b4b; }
      .muted { fill: #64748b; }
      .white { fill: #ffffff; }
      .label { font-size: 15px; font-weight: 800; letter-spacing: 2px; }
      .featureTitle { font-size: 17px; font-weight: 800; }
      .featureBody { font-size: 13px; font-weight: 450; }
    </style>
  </defs>

  <!-- Page background and soft decorative shapes -->
  <rect width="1000" height="1414" fill="url(#background)"/>
  <circle cx="972" cy="145" r="220" fill="#c4b5fd" opacity=".32"/>
  <circle cx="48" cy="774" r="180" fill="#bfdbfe" opacity=".32"/>
  <circle cx="934" cy="1030" r="166" fill="#bbf7d0" opacity=".34"/>
  <path d="M0 1190 C185 1120 325 1242 492 1190 C674 1134 824 1094 1000 1150 V1414 H0Z" fill="#e0e7ff" opacity=".68"/>
  <path d="M0 1240 C205 1170 330 1290 510 1238 C706 1182 840 1165 1000 1204 V1414 H0Z" fill="#ddd6fe" opacity=".38"/>

  <!-- Brand header -->
  <g transform="translate(62 48)">
    <rect width="58" height="58" rx="18" fill="url(#hero)"/>
    <path d="M29 15 C20 11 12 13 8 17 V43 C15 40 23 40 29 45 C35 40 43 40 50 43 V17 C46 13 38 11 29 15Z" fill="#fff" stroke="#fbbf24" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M29 16 V44 M14 23 H24 M14 29 H24 M34 23 H44 M34 29 H44" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="135" y="75" class="sans ink" font-size="27" font-weight="900" letter-spacing="1.2">LENDORA</text>
  <text x="136" y="99" class="sans muted" font-size="13" font-weight="700" letter-spacing="1.4">PERPUSTAKAAN DIGITAL</text>
  <rect x="711" y="58" width="228" height="38" rx="19" fill="#ffffff" opacity=".82"/>
  <circle cx="733" cy="77" r="5" fill="#22c55e"/>
  <text x="747" y="82" class="sans ink" font-size="13" font-weight="750">SMK NEGERI 5 SURAKARTA</text>

  <!-- Headline -->
  <text x="66" y="190" class="sans label" fill="#6366f1">SATU WEBSITE, BANYAK CERITA</text>
  <text x="62" y="261" class="sans ink" font-size="58" font-weight="900" letter-spacing="-1.8">Temukan bacaan.</text>
  <text x="62" y="326" class="sans" font-size="58" font-weight="900" letter-spacing="-1.8" fill="#5b4be7">Mulai petualangan.</text>
  <text x="67" y="369" class="sans muted" font-size="19" font-weight="450">
    <tspan x="67" dy="0">Cari buku, ajukan peminjaman, dan jelajahi</tspan>
    <tspan x="67" dy="27">layanan perpustakaan sekolah lewat LENDORA.</tspan>
  </text>

  <!-- Floating organic leaves -->
  <g transform="translate(876 188) rotate(15)">
    <path d="M20 124 C18 76 31 35 65 4" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 67 C4 65 -9 45 4 22 C34 27 49 42 42 67Z" fill="url(#leaf)"/>
    <path d="M50 46 C51 10 76 -4 101 4 C99 34 80 50 50 46Z" fill="#4ade80"/>
    <path d="M24 99 C-6 87 -12 64 1 48 C27 56 39 75 24 99Z" fill="#22c55e"/>
    <path d="M43 69 L13 31 M52 48 L91 13 M26 96 L7 57" fill="none" stroke="#dcfce7" stroke-width="2" opacity=".8"/>
  </g>
  <circle cx="850" cy="352" r="8" fill="#fbbf24"/>
  <circle cx="914" cy="382" r="5" fill="#fb7185"/>
  <path d="M920 315 l10 10 -10 10 -10-10z" fill="#818cf8"/>

  <!-- Laptop illustration -->
  <g>
    <rect x="128" y="446" width="650" height="403" rx="24" fill="#1e1b4b"/>
    <rect x="143" y="461" width="620" height="373" rx="14" fill="url(#screen)"/>
    <rect x="143" y="461" width="620" height="48" rx="14" fill="#ffffff"/>
    <path d="M143 495 H763 V509 H143Z" fill="#ffffff"/>
    <circle cx="164" cy="485" r="5" fill="#c7d2fe"/>
    <circle cx="181" cy="485" r="5" fill="#c7d2fe"/>
    <circle cx="198" cy="485" r="5" fill="#c7d2fe"/>
    <g transform="translate(169 520)">
      <rect width="31" height="31" rx="10" fill="url(#hero)"/>
      <path d="M15.5 8 C11 6 6 7 4 9 V24 C8 22 12 22 15.5 25 C19 22 23 22 27 24 V9 C25 7 20 6 15.5 8Z" fill="#fff" stroke="#fbbf24" stroke-width="1.4"/>
      <path d="M15.5 8 V24" stroke="#818cf8" stroke-width="1.2"/>
    </g>
    <text x="210" y="542" class="sans ink" font-size="19" font-weight="900">LENDORA</text>
    <text x="570" y="541" class="sans muted" font-size="11" font-weight="650">Beranda</text>
    <text x="626" y="541" class="sans muted" font-size="11" font-weight="650">Katalog</text>
    <rect x="690" y="522" width="56" height="27" rx="9" fill="#4f46e5"/>
    <text x="718" y="540" text-anchor="middle" class="sans white" font-size="10" font-weight="750">Masuk</text>

    <rect x="168" y="565" width="570" height="136" rx="18" fill="#eef2ff"/>
    <circle cx="697" cy="587" r="42" fill="#c4b5fd" opacity=".6"/>
    <circle cx="719" cy="669" r="23" fill="#bfdbfe" opacity=".85"/>
    <text x="190" y="599" class="sans" font-size="10" font-weight="800" letter-spacing="1.3" fill="#6366f1">PERPUSTAKAAN DIGITAL SEKOLAH</text>
    <text x="190" y="632" class="sans ink" font-size="25" font-weight="900">Selamat Datang di LENDORA</text>
    <text x="190" y="655" class="sans muted" font-size="12">Temukan, pinjam, dan baca buku favoritmu dengan mudah.</text>
    <rect x="190" y="668" width="116" height="24" rx="8" fill="#4f46e5"/>
    <text x="248" y="684" text-anchor="middle" class="sans white" font-size="9" font-weight="750">Jelajahi Katalog</text>

    <text x="170" y="731" class="sans ink" font-size="14" font-weight="850">Koleksi Pilihan</text>
    <rect x="170" y="743" width="133" height="78" rx="11" fill="#ffffff" stroke="#e0e7ff"/>
    <rect x="179" y="751" width="43" height="59" rx="6" fill="url(#bookA)"/>
    <path d="M188 763 H214 M188 769 H210 M188 775 H212" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="230" y="770" class="sans ink" font-size="9" font-weight="800">How to Win</text>
    <text x="230" y="784" class="sans muted" font-size="8">Dale Carnegie</text>
    <text x="230" y="801" class="sans" font-size="8" font-weight="750" fill="#16a34a">Tersedia</text>

    <rect x="312" y="743" width="133" height="78" rx="11" fill="#ffffff" stroke="#e0e7ff"/>
    <rect x="321" y="751" width="43" height="59" rx="6" fill="url(#bookB)"/>
    <path d="M330 763 H356 M330 769 H352 M330 775 H354" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="372" y="770" class="sans ink" font-size="9" font-weight="800">Mindset</text>
    <text x="372" y="784" class="sans muted" font-size="8">Carol S. Dweck</text>
    <text x="372" y="801" class="sans" font-size="8" font-weight="750" fill="#16a34a">Tersedia</text>

    <rect x="454" y="743" width="133" height="78" rx="11" fill="#ffffff" stroke="#e0e7ff"/>
    <rect x="463" y="751" width="43" height="59" rx="6" fill="url(#bookC)"/>
    <path d="M472 763 H498 M472 769 H494 M472 775 H496" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="514" y="770" class="sans ink" font-size="9" font-weight="800">Grit</text>
    <text x="514" y="784" class="sans muted" font-size="8">Angela Duckworth</text>
    <text x="514" y="801" class="sans" font-size="8" font-weight="750" fill="#16a34a">Tersedia</text>

    <rect x="596" y="743" width="142" height="78" rx="11" fill="#ffffff" stroke="#e0e7ff"/>
    <rect x="605" y="751" width="43" height="59" rx="6" fill="url(#bookD)"/>
    <path d="M614 763 H640 M614 769 H636 M614 775 H638" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="656" y="770" class="sans ink" font-size="9" font-weight="800">Cosmos</text>
    <text x="656" y="784" class="sans muted" font-size="8">Carl Sagan</text>
    <text x="656" y="801" class="sans" font-size="8" font-weight="750" fill="#16a34a">Tersedia</text>

    <path d="M91 850 H817 L783 876 Q779 880 769 880 H137 Q127 880 123 876Z" fill="#a5b4fc"/>
    <path d="M148 849 H760 L741 859 H167Z" fill="#c7d2fe"/>
  </g>

  <!-- Phone login screen overlaps the laptop -->
  <g>
    <rect x="731" y="566" width="202" height="365" rx="32" fill="#201d50"/>
    <rect x="741" y="577" width="182" height="343" rx="24" fill="#ffffff"/>
    <rect x="798" y="584" width="68" height="9" rx="5" fill="#c7d2fe"/>
    <g transform="translate(803 613)">
      <rect width="58" height="58" rx="18" fill="url(#hero)"/>
      <path d="M29 15 C20 11 12 13 8 17 V43 C15 40 23 40 29 45 C35 40 43 40 50 43 V17 C46 13 38 11 29 15Z" fill="#fff" stroke="#fbbf24" stroke-width="2"/>
      <path d="M29 16 V44" stroke="#818cf8" stroke-width="1.7"/>
    </g>
    <text x="832" y="693" text-anchor="middle" class="sans ink" font-size="17" font-weight="900">LENDORA</text>
    <text x="832" y="717" text-anchor="middle" class="sans muted" font-size="10">Masuk ke akunmu</text>
    <text x="762" y="750" class="sans ink" font-size="9" font-weight="750">Email</text>
    <rect x="761" y="758" width="162" height="35" rx="10" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="773" y="780" class="sans muted" font-size="9">nama@email.com</text>
    <text x="762" y="817" class="sans ink" font-size="9" font-weight="750">Kata sandi</text>
    <rect x="761" y="825" width="162" height="35" rx="10" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="773" y="847" class="sans muted" font-size="10">••••••••</text>
    <rect x="761" y="875" width="162" height="29" rx="9" fill="url(#hero)"/>
    <text x="842" y="894" text-anchor="middle" class="sans white" font-size="10" font-weight="800">MASUK</text>
  </g>

  <!-- Three concise feature cards -->
  <g>
    <rect x="62" y="970" width="284" height="145" rx="22" fill="#ffffff"/>
    <rect x="358" y="970" width="284" height="145" rx="22" fill="#ffffff"/>
    <rect x="654" y="970" width="284" height="145" rx="22" fill="#ffffff"/>
  </g>
  <g transform="translate(86 993)">
    <circle cx="24" cy="24" r="23" fill="#eef2ff"/>
    <circle cx="22" cy="22" r="8" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <path d="M28 28 L35 35" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="68" class="sans ink featureTitle">Cari koleksi dengan mudah</text>
    <text x="0" y="93" class="sans muted featureBody">Jelajahi buku pilihan untukmu.</text>
  </g>
  <g transform="translate(382 993)">
    <circle cx="24" cy="24" r="23" fill="#fef3c7"/>
    <path d="M14 12 H34 V37 H14Z M19 18 H29 M19 23 H29 M19 28 H26" fill="none" stroke="#d97706" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="68" class="sans ink featureTitle">Ajukan peminjaman online</text>
    <text x="0" y="93" class="sans muted featureBody">Ajukan buku tanpa antre panjang.</text>
  </g>
  <g transform="translate(678 993)">
    <circle cx="24" cy="24" r="23" fill="#dcfce7"/>
    <rect x="16" y="9" width="16" height="30" rx="4" fill="none" stroke="#15803d" stroke-width="2.3"/>
    <path d="M21 14 H27 M22 34 H26" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="68" class="sans ink featureTitle">Akses dari perangkatmu</text>
    <text x="0" y="93" class="sans muted featureBody">Nyaman lewat HP atau laptop.</text>
  </g>

  <!-- URL callout and slogan -->
  <g>
    <rect x="62" y="1143" width="876" height="184" rx="26" fill="url(#hero)"/>
  </g>
  <text x="96" y="1190" class="sans" font-size="14" font-weight="800" letter-spacing="2" fill="#c7d2fe">KUNJUNGI WEBSITE KAMI</text>
  <text x="96" y="1236" class="sans white" font-size="25" font-weight="850">lendora.infinityfree.me</text>
  <rect x="96" y="1255" width="808" height="1" fill="#ffffff" opacity=".25"/>
  <text x="96" y="1297" class="sans" font-size="19" font-weight="650" fill="#fef3c7">“Membaca hari ini, memimpin hari esok.”</text>
  <g transform="translate(849 1170)">
    <circle cx="27" cy="27" r="27" fill="#ffffff" opacity=".14"/>
    <path d="M15 27 H37 M27 17 V37 M20 20 L34 34 M34 20 L20 34" stroke="#fcd34d" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="64" y="1370" class="sans muted" font-size="13" font-weight="650">LENDORA  •  SMK Negeri 5 Surakarta</text>
  <text x="936" y="1370" text-anchor="end" class="sans muted" font-size="13" font-weight="650">Ayo membaca!</text>
</svg>
